<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeopardAI</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
<div id="banner">
    <h1>JeopardAI</h1>
</div>
<div id="home-screen-container">
    <h2>Classic</h2>
    <button id="quickplay-classic">Quickplay</button>
    <button id="custom-classic">Custom Game</button>   

    <h2>Practice</h2>
    <button id="quickplay-classic">Quickplay</button>
    <button id="custom-classic">Custom Practice</button>
    <button id="confidence-tester-practice-button">Confidence Test</button>

    <h3>My Stats</h3>
    <h4>Create/sign into account to track your stats</h4>
</div>

<!-- this would replace the home-screen-container when cutom x is pressed
 only difference between custom game and custom practice is that practice won't have bots -->
<div id="custom-settings-container">
    <!-- !RESTRUCTURE THIS INTO AN EDITABLE TABLE WITH HEADERS -->
    <div id="category-container">
        <table id="game-settings-table">
            <tr>
                <th id="col1"><input type="text" id="col1-input" value="AI-Generated Category"></th>
                <th id="col2"><input type="text" id="col2-input" value="AI-Generated Category"></th>
                <th id="col3"><input type="text" id="col3-input" value="AI-Generated Category"></th>
                <th id="col4"><input type="text" id="col4-input" value="AI-Generated Category"></th>
                <th id="col5"><input type="text" id="col5-input" value="AI-Generated Category"></th>
                <th id="col6"><input type="text" id="col6-input" value="AI-Generated Category"></th>
            </tr>

            <tr>
                <td id="col1-q1"><input type="text" id="col1-q1-value-input" value="200"></td>
                <td id="col2-q1"><input type="text" id="col2-q1-value-input" value="200"></td>
                <td id="col3-q1"><input type="text" id="col3-q1-value-input" value="200"></td>
                <td id="col4-q1"><input type="text" id="col4-q1-value-input" value="200"></td>
                <td id="col5-q1"><input type="text" id="col5-q1-value-input" value="200"></td>
                <td id="col6-q1"><input type="text" id="col6-q1-value-input" value="200"></td>
            </tr>


            
            <tr>
                <td id="col1-q2"><input type="text" id="col1-q2-value-input" value="400"></td>
                <td id="col2-q2"><input type="text" id="col2-q2-value-input" value="400"></td>
                <td id="col3-q2"><input type="text" id="col3-q2-value-input" value="400"></td>
                <td id="col4-q2"><input type="text" id="col4-q2-value-input" value="400"></td>
                <td id="col5-q2"><input type="text" id="col5-q2-value-input" value="400"></td>
                <td id="col6-q2"><input type="text" id="col6-q2-value-input" value="400"></td>
            </tr>

            
            <tr>
                <td id="col1-q3"><input type="text" id="col1-q3-value-input" value="600"></td>

                <td id="col5-q3"><input type="text" id="col5-q3-value-input" value="600"></td>
                <td id="col6-q3"><input type="text" id="col6-q3-value-input" value="600"></td>
            </tr>

            
            <tr>
                <td id="col1-q4"><input type="text" id="col1-q4-value-input" value="800"></td>
                <td id="col2-q4"><input type="text" id="col2-q4-value-input" value="800"></td>
                <td id="col3-q4"><input type="text" id="col3-q4-value-input" value="800"></td>
                <td id="col4-q4"><input type="text" id="col4-q4-value-input" value="800"></td>
                <td id="col5-q4"><input type="text" id="col5-q4-value-input" value="800"></td>
                <td id="col6-q4"><input type="text" id="col6-q4-value-input" value="800"></td>
            </tr>

            
            <tr>
                <td id="col1-q5"><input type="text" id="col1-q5-value-input" value="1000"></td>
                <td id="col2-q5"><input type="text" id="col2-q5-value-input" value="1000"></td>
                <td id="col3-q5"><input type="text" id="col3-q5-value-input" value="1000"></td>
                <td id="col4-q5"><input type="text" id="col4-q5-value-input" value="1000"></td>
                <td id="col5-q5"><input type="text" id="col5-q5-value-input" value="1000"></td>
                <td id="col6-q5"><input type="text" id="col6-q5-value-input" value="1000"></td>
            </tr>

                        
        </table>
    </div>
    <div id="difficulty-container">
        <h3>Difficulty</h3>
        <select name="difficulty-selection" id="difficulty-selection" required>
            <option value="" disabled selected hidden>Choose Difficulty</option>
            <option value="very easy">Very Easy</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="very hard">Very Hard</option>
            <option value="master">Master</option>
            
        </select>
    </div>
    
</div>

<!-- this container will contain the actual game -->

</div>
